#
# Private GitHub Release for unsigned cnshift.duckdb_extension binaries.
#
# Trigger:
# 1. Push to `main` branch: automatically checks if `VERSION` file has a new
#    unreleased version. If so, tags `sql-v*` / `ext-v*`, publishes SQL release,
#    builds platform binaries, and publishes extension release.
# 2. Push an `ext-v*` tag directly (must be on `main`).
#
# This is NOT duckdb/community-extensions deploy (forbidden: legal/compliance).
# Do not call _extension_deploy.yml (that path uploads to DuckDB org S3).
#
name: Extension GitHub Release
on:
  push:
    branches:
      - main
    tags:
      - "ext-v*"

concurrency:
  group: ext-github-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  guard:
    name: Check release requirement
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      ext_tag: ${{ steps.check.outputs.ext_tag }}
      sql_tag: ${{ steps.check.outputs.sql_tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: Check tag or main branch version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Case 1: Triggered by manual ext-v* tag push
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "$tag" =~ ^ext-v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
              echo "Ref '$tag' is not an ext-vMAJOR.MINOR.PATCH tag (docs/VERSIONING.md)."
              exit 1
            fi
            git fetch origin refs/heads/main:refs/remotes/origin/main --prune
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on origin/main."
              echo "Merge to main first, then tag that commit. Do not publish from dev."
              exit 1
            fi
            ver="${tag#ext-v}"
            echo "OK: $GITHUB_SHA is on origin/main. Releasing $tag"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "ext_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "sql_tag=sql-v$ver" >> "$GITHUB_OUTPUT"
            echo "version=$ver" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Case 2: Triggered by push to main branch
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            if [ ! -f VERSION ]; then
              echo "No VERSION file found at root. Skipping auto-release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ver="$(tr -d '[:space:]' < VERSION)"
            if [[ ! "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
              echo "Invalid version string '$ver' in VERSION file. Skipping auto-release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            ext_tag="ext-v$ver"
            sql_tag="sql-v$ver"

            # Check if tag already exists in remote
            if git ls-remote --tags origin "refs/tags/$ext_tag" | grep -q "$ext_tag"; then
              echo "Tag $ext_tag already exists on remote. Skipping auto-release."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "New version $ver detected on main. Creating tags and publishing releases..."

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Create and push git tags
            git tag -a "$sql_tag" -m "Release $sql_tag"
            git tag -a "$ext_tag" -m "Release $ext_tag"
            git push origin "$sql_tag" "$ext_tag"

            # Publish SQL track release
            cat << 'EOF' > /tmp/sql_release_notes.md
## duckdb-cn-shift SQL Macros Release

Primary deliverable: [`sql/cnshift.sql`](https://github.com/tshelianthus/duckdb-cn-shift/blob/main/sql/cnshift.sql)

Provides zero-dependency (pure SQL macro) China coordinate transformations for DuckDB using the official `spatial` extension.

### Quick Start (SQL)

```sql
INSTALL spatial;
LOAD spatial;
.read 'sql/cnshift.sql'

SELECT wgs84_to_gcj02(31.2304, 121.4737);
SELECT wgs84_to_gcj02(geom) FROM parcels;
```
EOF
            gh release create "$sql_tag" \
              --title "$sql_tag: SQL Macros Release" \
              --notes-file /tmp/sql_release_notes.md || true
            rm -f /tmp/sql_release_notes.md

            echo "should_release=true" >> "$GITHUB_OUTPUT"
            echo "ext_tag=$ext_tag" >> "$GITHUB_OUTPUT"
            echo "sql_tag=$sql_tag" >> "$GITHUB_OUTPUT"
            echo "version=$ver" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unsupported ref ${GITHUB_REF_NAME}. Skipping."
          echo "should_release=false" >> "$GITHUB_OUTPUT"

  duckdb-stable-build:
    name: Build extension binaries
    needs: guard
    if: needs.guard.outputs.should_release == 'true'
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: cnshift
      reduced_ci_mode: disabled

  code-quality-check:
    name: Code Quality Check
    needs: guard
    if: needs.guard.outputs.should_release == 'true'
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: cnshift
      format_checks: "format;tidy"

  github-release:
    name: Attach binaries to GitHub Release
    needs:
      - guard
      - duckdb-stable-build
      - code-quality-check
    if: needs.guard.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      DUCKDB_VERSION: v1.5.5
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cnshift-${{ env.DUCKDB_VERSION }}-extension-*
          path: artifacts
          merge-multiple: false

      - name: Pack release assets
        env:
          TAG: ${{ needs.guard.outputs.ext_tag }}
        run: |
          set -euo pipefail
          mkdir -p dist
          found=0
          shopt -s nullglob
          for dir in artifacts/cnshift-"${DUCKDB_VERSION}"-extension-*; do
            [ -d "$dir" ] || continue
            arch="${dir##*-extension-}"
            native="$(find "$dir" -type f -name 'cnshift.duckdb_extension' -print -quit)"
            wasm="$(find "$dir" -type f -name 'cnshift.duckdb_extension.wasm' -print -quit)"
            if [ -n "$native" ]; then
              cp "$native" "dist/cnshift-${TAG}-duckdb-${DUCKDB_VERSION}-${arch}.duckdb_extension"
              found=1
            elif [ -n "$wasm" ]; then
              cp "$wasm" "dist/cnshift-${TAG}-duckdb-${DUCKDB_VERSION}-${arch}.duckdb_extension.wasm"
              found=1
            else
              echo "warning: no extension binary in $dir" >&2
              find "$dir" -type f >&2 || true
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "error: packed zero binaries" >&2
            ls -laR artifacts >&2 || true
            exit 1
          fi
          (cd dist && shasum -a 256 * > SHA256SUMS)
          ls -la dist

      - name: Write release notes
        env:
          TAG: ${{ needs.guard.outputs.ext_tag }}
        run: |
          python3 - <<'PY'
          import os
          duckdb = os.environ["DUCKDB_VERSION"]
          tag = os.environ["TAG"]
          open("release-notes.md", "w").write(
              f"""Unsigned private `cnshift` binaries for DuckDB **{duckdb}**. This is **not** a community-extensions listing. There is no `INSTALL cnshift FROM community`.

          ### Load a downloaded file

          1. Download the asset that matches your OS/CPU (see the platform table in `ext/README.md`).
          2. Allow unsigned extensions and `LOAD` the file:

          ```sql
          SET allow_unsigned_extensions = true;
          LOAD '/abs/path/cnshift.duckdb_extension';
          ```

          CLI: `duckdb -unsigned`

          Asset names: `cnshift-{tag}-duckdb-{duckdb}-<arch>.duckdb_extension`

          The binary must match this DuckDB version (`{duckdb}`). Check with `SELECT version();` and `PRAGMA platform;`.

          ### Build from source

          `ext/README.md` (submodules + `make release`). SQL-first users can ignore this release and use `sql/cnshift.sql` instead.
          """
          )
          PY

      - name: Publish GitHub Release
        env:
          TAG: ${{ needs.guard.outputs.ext_tag }}
        run: |
          set -euo pipefail
          tag="${TAG}"
          title="$tag (cnshift, DuckDB ${DUCKDB_VERSION})"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$title" \
              --notes-file release-notes.md
          fi
