#
# Private GitHub Release for unsigned cnshift.duckdb_extension binaries.
#
# Trigger: push an ext-v* tag (docs/VERSIONING.md). sql-v* tags do not run this.
# The tagged commit MUST already be on origin/main (dev / feature tags are
# rejected before the platform matrix runs).
# This is NOT duckdb/community-extensions deploy (forbidden: legal/compliance).
# Do not call _extension_deploy.yml (that path uploads to DuckDB org S3).
#
# Path-filtered MainDistributionPipeline.yml does not run on tag-only pushes,
# so this workflow rebuilds the full matrix and attaches those artifacts.
#
name: Extension GitHub Release
on:
  push:
    tags:
      - "ext-v*"
  workflow_dispatch:

concurrency:
  group: ext-github-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: Require tag on main
    runs-on: ubuntu-latest
    steps:
      - name: Check ext-v* tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^ext-v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Ref '$tag' is not an ext-vMAJOR.MINOR.PATCH tag (docs/VERSIONING.md)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require tagged commit is on origin/main
        run: |
          set -euo pipefail
          git fetch origin refs/heads/main:refs/remotes/origin/main --prune
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not on origin/main."
            echo "Merge to main first, then tag that commit. Do not publish from dev."
            exit 1
          fi
          echo "OK: $GITHUB_SHA is on origin/main"

  duckdb-stable-build:
    name: Build extension binaries
    needs: guard
    permissions:
      contents: read
      actions: write
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: cnshift
      reduced_ci_mode: disabled

  code-quality-check:
    name: Code Quality Check
    needs: guard
    permissions:
      contents: read
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: cnshift
      format_checks: "format;tidy"

  github-release:
    name: Attach binaries to GitHub Release
    needs:
      - duckdb-stable-build
      - code-quality-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      DUCKDB_VERSION: v1.5.5
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cnshift-${{ env.DUCKDB_VERSION }}-extension-*
          path: artifacts
          merge-multiple: false

      - name: Pack release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          found=0
          shopt -s nullglob
          for dir in artifacts/cnshift-"${DUCKDB_VERSION}"-extension-*; do
            [ -d "$dir" ] || continue
            arch="${dir##*-extension-}"
            native="$(find "$dir" -type f -name 'cnshift.duckdb_extension' -print -quit)"
            wasm="$(find "$dir" -type f -name 'cnshift.duckdb_extension.wasm' -print -quit)"
            if [ -n "$native" ]; then
              cp "$native" "dist/cnshift-${GITHUB_REF_NAME}-duckdb-${DUCKDB_VERSION}-${arch}.duckdb_extension"
              found=1
            elif [ -n "$wasm" ]; then
              cp "$wasm" "dist/cnshift-${GITHUB_REF_NAME}-duckdb-${DUCKDB_VERSION}-${arch}.duckdb_extension.wasm"
              found=1
            else
              echo "warning: no extension binary in $dir" >&2
              find "$dir" -type f >&2 || true
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "error: packed zero binaries" >&2
            ls -laR artifacts >&2 || true
            exit 1
          fi
          (cd dist && shasum -a 256 * > SHA256SUMS)
          ls -la dist

      - name: Write release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          duckdb = os.environ["DUCKDB_VERSION"]
          tag = os.environ["TAG"]
          open("release-notes.md", "w").write(
              f"""Unsigned private `cnshift` binaries for DuckDB **{duckdb}**. This is **not** a community-extensions listing. There is no `INSTALL cnshift FROM community`.

          ### Load a downloaded file

          1. Download the asset that matches your OS/CPU (see the platform table in `ext/README.md`).
          2. Allow unsigned extensions and `LOAD` the file:

          ```sql
          SET allow_unsigned_extensions = true;
          LOAD '/abs/path/cnshift.duckdb_extension';
          ```

          CLI: `duckdb -unsigned`

          Asset names: `cnshift-{tag}-duckdb-{duckdb}-<arch>.duckdb_extension`

          The binary must match this DuckDB version (`{duckdb}`). Check with `SELECT version();` and `PRAGMA platform;`.

          ### Build from source

          `ext/README.md` (submodules + `make release`). SQL-first users can ignore this release and use `sql/cnshift.sql` instead.
          """
          )
          PY

      - name: Publish GitHub Release
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          title="$tag (cnshift, DuckDB ${DUCKDB_VERSION})"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --title "$title" \
              --notes-file release-notes.md
          fi
